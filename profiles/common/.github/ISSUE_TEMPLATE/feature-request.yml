name: Feature Request
description: Suggest a new feature
title: '[Feature]: '
labels: [enhancement]
body:
    - type: textarea
      attributes:
          label: Problem
          description: What problem does this feature solve?
      validations:
          required: true
    - type: textarea
      attributes:
          label: Proposed Solution
          description: What would you like to see?
      validations:
          required: true
