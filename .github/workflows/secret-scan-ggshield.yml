name: 'Secret Scan (GitGuardian)'

on:
  workflow_call:
    inputs:
      version:
        description: 'ggshield version (pip installable)'
        type: string
        default: '1.38.0'
      path:
        description: 'Path to scan (defaults to entire repo)'
        type: string
        default: '.'
      args:
        description: 'Additional ggshield arguments'
        type: string
        default: ''
    secrets:
      GITGUARDIAN_API_KEY:
        description: 'GitGuardian API key for secret detection'
        required: true

permissions:
  contents: read

jobs:
  scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ggshield
        run: |
          pip install uv
          uv pip install --system ggshield==${{ inputs.version }}

      - name: Run ggshield
        env:
          GITGUARDIAN_API_KEY: '${{ secrets.GITGUARDIAN_API_KEY }}'
        run: |
          ggshield secret scan ci \
            ${{ inputs.path }} \
            ${{ inputs.args }}
