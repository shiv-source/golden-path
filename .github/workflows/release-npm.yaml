name: 'Release (npm)'

on:
    workflow_call:
        inputs:
            node-version:
                description: 'Node.js version'
                type: string
                default: '22'
            registry:
                description: 'npm registry URL'
                type: string
                default: 'https://registry.npmjs.org'
            scope:
                description: 'npm scope (e.g., @myorg) — omit for unscoped packages'
                type: string
                default: ''
            version:
                description: 'Explicit version to publish (skips release-please)'
                type: string
                default: ''
            npm-tag:
                description: 'npm dist-tag (e.g., next, beta). Only used when version is set.'
                type: string
                default: ''
            dry-run:
                description: 'Run in dry-run mode (no actual publish)'
                type: boolean
                default: false
            working-directory:
                description: 'Working directory for the npm package'
                type: string
                default: '.'
        secrets:
            NPM_TOKEN:
                description: 'npm registry auth token'
                required: true
        outputs:
            version:
                description: 'Published version (e.g., 1.2.3)'
                value: '${{ jobs.release.outputs.version }}'
            release_created:
                description: 'Whether a release was created (false for dry-run or no new version)'
                value: '${{ jobs.release.outputs.release_created }}'

permissions:
    contents: write
    id-token: write
    packages: write

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            version: "${{ (steps.release-please.outputs.major || steps.version.outputs.major) && format('{0}.{1}.{2}', steps.release-please.outputs.major || steps.version.outputs.major, steps.release-please.outputs.minor || steps.version.outputs.minor, steps.release-please.outputs.patch || steps.version.outputs.patch) || '' }}"
            release_created: '${{ steps.release-please.outputs.release_created || steps.version.outputs.release_created }}'
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0

            - uses: shiv-source/golden-path/.github/actions/setup-node@main
              with:
                  node-version: ${{ inputs.node-version }}
                  package-manager: npm
                  working-directory: ${{ inputs.working-directory }}
                  registry-url: ${{ inputs.registry }}
                  scope: ${{ inputs.scope }}
                  auth-token: ${{ secrets.NPM_TOKEN }}

            - name: Determine next version
              id: release-please
              if: inputs.version == ''
              # googleapis/release-please-action@v5.0.0
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
              with:
                  release-type: node
                  dry-run: '${{ inputs.dry-run }}'

            - name: Parse explicit version
              id: version
              if: inputs.version != ''
              run: |
                  V=$(echo "${{ inputs.version }}" | sed 's/-.*//')
                  IFS='.' read -r major minor patch <<< "$V"
                  {
                    echo "major=$major"
                    echo "minor=$minor"
                    echo "patch=$patch"
                    echo "release_created=${{ !inputs.dry-run }}"
                  } >> "$GITHUB_OUTPUT"

            - name: Publish explicit version
              if: inputs.version != '' && !inputs.dry-run
              run: |
                  flags=""
                  if [ -n "${{ inputs.npm-tag }}" ]; then
                    flags="--tag ${{ inputs.npm-tag }}"
                  fi
                  npm version ${{ inputs.version }} --no-git-tag-version
                  # shellcheck disable=SC2086
                  npm publish --provenance $flags
              working-directory: '${{ inputs.working-directory }}'
              env:
                  NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'

            - name: Publish from release-please
              if: steps.release-please.outputs.release_created && !inputs.dry-run
              run: npm publish --provenance
              working-directory: '${{ inputs.working-directory }}'
              env:
                  NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'
