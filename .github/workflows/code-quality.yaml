name: 'Code Quality'

on:
    workflow_call:
        inputs:
            # --- Gate toggles -------------------------------------------------
            go:
                description: 'Enable the Go build/lint/test gate'
                type: boolean
                default: false
            node:
                description: 'Enable the Node.js build/lint/typecheck/test gate'
                type: boolean
                default: false
            actionlint:
                description: 'Lint workflow files with actionlint'
                type: boolean
                default: true
            codespell:
                description: 'Run codespell spell check'
                type: boolean
                default: true
            secret-scan:
                description: 'Run secret scanning with Betterleaks'
                type: boolean
                default: true
            security-scan:
                description: 'Run Gitleaks secret scan and CodeQL analysis'
                type: boolean
                default: true

            # --- Go gate ------------------------------------------------------
            go-version:
                description: 'Go version (ignored when go-version-file is set)'
                type: string
                default: 'stable'
            go-version-file:
                description: 'Path to go.mod or go.work that pins the Go version'
                type: string
                default: ''
            working-directory:
                description: 'Working directory for the Go and Node.js projects'
                type: string
                default: '.'
            setup-command:
                description: >-
                    Command run after Go setup and before tests/build (e.g. build
                    embedded assets the Go code embeds).
                type: string
                default: ''
            test-args:
                description: >-
                    Arguments passed to go test. Defaults to
                    '-race -coverprofile=coverage.out ./...'
                type: string
                default: ''
            coverage-floor:
                description: 'Minimum required total Go coverage percentage (0 disables the gate)'
                type: number
                default: 0
            cross-compile:
                description: 'Cross-compile the Go module for multiple GOOS/GOARCH combinations'
                type: boolean
                default: false
            goos:
                description: 'JSON array of GOOS targets to build when cross-compile is enabled'
                type: string
                default: '["linux","darwin","windows"]'
            goarch:
                description: 'JSON array of GOARCH targets to build when cross-compile is enabled'
                type: string
                default: '["amd64","arm64"]'
            change-detection:
                description: 'Skip Go gates when no matching files changed on a pull request'
                type: boolean
                default: false
            change-paths:
                description: 'JSON array of glob patterns used for Go change detection'
                type: string
                default: '["**/*.go","go.mod","go.sum",".golangci.yaml",".github/"]'
            golangci-lint-version:
                description: 'golangci-lint release tag'
                type: string
                default: 'v2.13.1'
            golangci-lint-config:
                description: 'Path to the golangci-lint config file'
                type: string
                default: '.golangci.yaml'
            golangci-lint-timeout:
                description: 'golangci-lint run timeout'
                type: string
                default: '5m'
            golangci-lint-args:
                description: 'Extra golangci-lint arguments'
                type: string
                default: ''

            # --- Node.js gate -------------------------------------------------
            node-version:
                description: 'Node.js version'
                type: string
                default: '22'
            package-manager:
                description: 'Package manager: auto (detect), npm, pnpm, or yarn'
                type: string
                default: 'auto'
            shard-count:
                description: 'Number of Node.js test shards for parallel execution'
                type: number
                default: 3
            lint-command:
                description: 'Node.js lint command'
                type: string
                default: 'npm run lint'
            typecheck-command:
                description: 'Node.js type check command'
                type: string
                default: 'npm run typecheck'
            test-command:
                description: 'Node.js test command'
                type: string
                default: 'npm test'
            build-command:
                description: 'Node.js build command'
                type: string
                default: 'npm run build'

            # --- Security scan ------------------------------------------------
            language:
                description: >-
                    Programming language for CodeQL (node, go, python, java).
                    Empty (default) lets CodeQL auto-detect the repo's languages.
                type: string
                default: ''
            gitleaks-config:
                description: 'Path to custom Gitleaks config (defaults to built-in rules)'
                type: string
                default: ''

            # --- Secret scan --------------------------------------------------
            secret-scan-version:
                description: 'Betterleaks version'
                type: string
                default: 'v1.8.1'
            secret-scan-path:
                description: 'Path to scan for secrets (git repo or directory)'
                type: string
                default: '.'
            secret-scan-config:
                description: 'Path to betterleaks.toml config file'
                type: string
                default: ''
            secret-scan-args:
                description: 'Additional Betterleaks arguments'
                type: string
                default: ''

            # --- Codespell ----------------------------------------------------
            codespell-version:
                description: 'Codespell version (pip installable)'
                type: string
                default: '2.4.3'
            codespell-path:
                description: 'Path to spell check (defaults to entire repo)'
                type: string
                default: '.'
            ignore-words-file:
                description: 'Path to a custom ignore-words file'
                type: string
                default: ''
            skip:
                description: 'Comma-separated paths to skip'
                type: string
                default: '.git,node_modules,dist,build,vendor,package-lock.json,*.lock,*.sum'
            codespell-args:
                description: 'Additional codespell arguments'
                type: string
                default: ''

            # --- Actionlint ---------------------------------------------------
            actionlint-version:
                description: 'actionlint version'
                type: string
                default: 'v1.7.12'
            actionlint-config:
                description: 'Path to an actionlint config file'
                type: string
                default: ''
            actionlint-args:
                description: 'Extra actionlint arguments'
                type: string
                default: '-color'

        outputs:
            coverage:
                description: 'Go test coverage percentage (empty when the go gate is disabled)'
                value: ${{ jobs.go-node.outputs.coverage }}
            coverage_floor:
                description: 'Configured Go coverage floor percentage'
                value: ${{ jobs.go-node.outputs.coverage_floor }}
            passed:
                description: 'true when every enabled gate passed'
                value: ${{ jobs.final-gate.outputs.passed }}

permissions:
    contents: read

jobs:
    # Language gates are composed via go-node.yaml (the leaf build-test-*
    # workflows are never referenced here); it runs without its own final-gate
    # so quality owns the single aggregate below.
    go-node:
        if: inputs.go || inputs.node
        uses: shiv-source/golden-path/.github/workflows/go-node.yaml@main
        with:
            go: ${{ inputs.go }}
            node: ${{ inputs.node }}
            go-version: ${{ inputs.go-version }}
            go-version-file: ${{ inputs.go-version-file }}
            working-directory: ${{ inputs.working-directory }}
            setup-command: ${{ inputs.setup-command }}
            test-args: ${{ inputs.test-args }}
            coverage-floor: ${{ inputs.coverage-floor }}
            cross-compile: ${{ inputs.cross-compile }}
            goos: ${{ inputs.goos }}
            goarch: ${{ inputs.goarch }}
            change-detection: ${{ inputs.change-detection }}
            change-paths: ${{ inputs.change-paths }}
            golangci-lint-version: ${{ inputs.golangci-lint-version }}
            golangci-lint-config: ${{ inputs.golangci-lint-config }}
            golangci-lint-timeout: ${{ inputs.golangci-lint-timeout }}
            golangci-lint-args: ${{ inputs.golangci-lint-args }}
            node-version: ${{ inputs.node-version }}
            package-manager: ${{ inputs.package-manager }}
            shard-count: ${{ inputs.shard-count }}
            lint-command: ${{ inputs.lint-command }}
            typecheck-command: ${{ inputs.typecheck-command }}
            test-command: ${{ inputs.test-command }}
            build-command: ${{ inputs.build-command }}
            final-gate: false

    security:
        if: inputs.security-scan
        permissions:
            contents: read
            security-events: write
        uses: shiv-source/golden-path/.github/workflows/security-scan.yaml@main
        with:
            language: ${{ inputs.language }}
            gitleaks-config: ${{ inputs.gitleaks-config }}

    secret-scan:
        if: inputs.secret-scan
        uses: shiv-source/golden-path/.github/workflows/secret-scan-betterleaks.yaml@main
        with:
            version: ${{ inputs.secret-scan-version }}
            path: ${{ inputs.secret-scan-path }}
            config: ${{ inputs.secret-scan-config }}
            args: ${{ inputs.secret-scan-args }}

    codespell:
        if: inputs.codespell
        uses: shiv-source/golden-path/.github/workflows/codespell.yaml@main
        with:
            version: ${{ inputs.codespell-version }}
            path: ${{ inputs.codespell-path }}
            ignore-words-file: ${{ inputs.ignore-words-file }}
            skip: ${{ inputs.skip }}
            args: ${{ inputs.codespell-args }}

    actionlint:
        if: inputs.actionlint
        uses: shiv-source/golden-path/.github/workflows/actionlint.yaml@main
        with:
            version: ${{ inputs.actionlint-version }}
            config: ${{ inputs.actionlint-config }}
            args: ${{ inputs.actionlint-args }}

    final-gate:
        # Always emitted: quality always exposes a single required check so
        # consumers never need to assemble their own aggregate.
        if: always()
        needs: [go-node, security, secret-scan, codespell, actionlint]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            passed: ${{ steps.gate.outputs.passed }}
        steps:
            - name: Aggregate results
              id: gate
              uses: shiv-source/golden-path/.github/actions/final-gate@main
              with:
                  results: ${{ format('go-node={0} security={1} secret-scan={2} codespell={3} actionlint={4}', needs.go-node.result, needs.security.result, needs.secret-scan.result, needs.codespell.result, needs.actionlint.result) }}
                  coverage: ${{ needs.go-node.outputs.coverage }}
