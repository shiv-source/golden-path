name: 'Dependency Auto-Merge'

on:
  workflow_call:
    inputs:
      package-ecosystem:
        description: 'Package ecosystem (npm, go, pip, maven)'
        type: string
        default: 'npm'
      auto-merge:
        description: 'Auto-merge non-breaking dependency updates'
        type: boolean
        default: true
    outputs:
      update_type:
        description: 'Semver bump type from Dependabot (version-update:semver-patch|minor|major)'
        value: '${{ jobs.auto-merge.outputs.update_type }}'
      is_auto_merged:
        description: 'Whether the PR was approved and auto-merged'
        value: '${{ jobs.auto-merge.outputs.is_auto_merged }}'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Dependabot Auto-Merge
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      update_type: '${{ steps.metadata.outputs.update-type }}'
      is_auto_merged: '${{ steps.merge-result.outputs.merged }}'
    steps:
      - uses: actions/checkout@v4
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
      - name: Set merge default
        id: merge-result
        run: echo "merged=false" >> "$GITHUB_OUTPUT"

      - name: Approve and auto-merge
        if: ${{ inputs.auto-merge && (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor') }}
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh pr review "${{ github.event.pull_request.html_url }}" --approve
          gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash
          echo "merged=true" >> "$GITHUB_OUTPUT"
