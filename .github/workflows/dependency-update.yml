name: 'Dependency Auto-Merge'

on:
  workflow_call:
    inputs:
      package-ecosystem:
        description: 'Package ecosystem (npm, go, pip, maven)'
        type: string
        default: 'npm'
      auto-merge:
        description: 'Auto-merge non-breaking dependency updates'
        type: boolean
        default: true

jobs:
  auto-merge:
    name: Dependabot Auto-Merge
    if: ${{ github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
      - name: Approve and auto-merge
        if: ${{ inputs.auto-merge && (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor') }}
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh pr review "${{ github.event.pull_request.html_url }}" --approve
          gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash
