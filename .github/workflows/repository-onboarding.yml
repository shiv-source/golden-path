name: 'Repository Onboarding'
on:
  issues:
    types: [opened, labeled]

jobs:
  onboard:
    name: Onboard Repository
    if: |
      github.event.issue.title == '[Onboarding]: ' ||
      github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Parse issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const { parseOnboardingIssue } = await import(
              '${{ github.workspace }}/scripts/parse-onboarding-issue.mjs'
            );
            const r = parseOnboardingIssue(context.payload.issue.body);
            core.setOutput('repoName', r.repoName);
            core.setOutput('type', r.type);
            core.setOutput('language', r.language);
            core.setOutput('options', JSON.stringify(r.options));
            if (!r.repoName) core.setFailed('Could not parse repository name.');

      - name: Validate repo exists
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          repo="${{ github.repository_owner }}/${{ steps.parse.outputs.repoName }}"
          if ! gh repo view "$repo" --json name > /dev/null 2>&1; then
            echo "::error::Repository $repo does not exist."
            gh issue comment "${{ github.event.issue.html_url }}" \
              --body "❌ Repository \`${{ steps.parse.outputs.repoName }}\` does not exist. Create it first."
            exit 1
          fi

      - name: Generate config
        id: config
        uses: actions/github-script@v7
        with:
          script: |
            const { generateRepoConfig } = await import(
              '${{ github.workspace }}/scripts/generate-repo-config.mjs'
            );
            const { resolveProfilesFor } = await import(
              '${{ github.workspace }}/scripts/lib/profile-map.mjs'
            );
            const fs = require('node:fs');
            const path = require('node:path');
            const r = {
              repoName: '${{ steps.parse.outputs.repoName }}',
              type: '${{ steps.parse.outputs.type }}',
              language: '${{ steps.parse.outputs.language }}',
              options: JSON.parse('${{ steps.parse.outputs.options }}'),
            };
            const yaml = generateRepoConfig(r);
            const dir = path.join(process.env.GITHUB_WORKSPACE, 'repositories');
            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(path.join(dir, `${r.repoName}.yaml`), yaml);
            core.setOutput('profiles', JSON.stringify(resolveProfilesFor(r.language, r.type)));

      - name: Create PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { configureGit, commitAndPush } = await import(
              '${{ github.workspace }}/scripts/git-commit-push.mjs'
            );
            const { openOrReusePR } = await import(
              '${{ github.workspace }}/scripts/open-or-reuse-pr.mjs'
            );
            configureGit();
            const branch = 'feature/onboard-${{ steps.parse.outputs.repoName }}';
            commitAndPush({ branch, message: 'chore: onboard ${{ steps.parse.outputs.repoName }}', files: 'repositories/' });
            const profiles = JSON.parse('${{ steps.config.outputs.profiles }}').join(', ');
            const result = await openOrReusePR({
              repo: '${{ github.repository }}',
              baseBranch: 'main',
              headBranch: branch,
              title: 'Onboard ${{ steps.parse.outputs.repoName }}',
              body: [
                '## Repository Onboarding',
                '',
                '**Repository:** `${{ steps.parse.outputs.repoName }}`',
                '**Language:** ${{ steps.parse.outputs.language }}',
                '**Type:** ${{ steps.parse.outputs.type }}',
                '**Profiles:** ' + profiles,
                '',
                'Generated `repositories/${{ steps.parse.outputs.repoName }}.yaml`.',
                '',
                'Once merged, `apply-repository-config.yml` will apply the standard configuration.',
              ].join('\n'),
            });
            core.setOutput('prUrl', result.url);

      - name: Comment on issue
        if: steps.pr.outputs.prUrl != ''
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh issue comment "${{ github.event.issue.html_url }}" \
            --body "✅ **Onboarding PR**: ${{ steps.pr.outputs.prUrl }}"
