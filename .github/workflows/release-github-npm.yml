name: 'Release (GitHub + npm)'

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        type: string
        required: true
      npm-prerelease:
        description: 'Publish prerelease tags to npm with --tag next'
        type: boolean
        default: false
      npm-registry:
        description: 'npm registry URL'
        type: string
        default: 'https://registry.npmjs.org'
      npm-scope:
        description: 'npm scope (e.g., @myorg)'
        type: string
        default: ''
      node-version:
        description: 'Node.js version'
        type: string
        default: '22'
      generate-release-notes:
        description: 'Auto-generate GitHub release notes'
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        description: 'npm registry auth token'
        required: true

jobs:
  github-release:
    name: GitHub Release
    uses: ./.github/workflows/release-github.yml
    with:
      tag: '${{ inputs.tag }}'
      generate-release-notes: ${{ inputs.generate-release-notes }}

  npm-publish:
    name: npm Publish
    needs: [github-release]
    if: needs.github-release.outputs.isReleased == 'true' && (needs.github-release.outputs.is_prerelease != 'true' || inputs.npm-prerelease)
    uses: ./.github/workflows/release-npm.yml
    with:
      version: '${{ needs.github-release.outputs.version }}'
      node-version: '${{ inputs.node-version }}'
      registry: '${{ inputs.npm-registry }}'
      scope: '${{ inputs.npm-scope }}'
      npm-tag: ${{ needs.github-release.outputs.is_prerelease == 'true' && 'next' || '' }}
    secrets:
      NPM_TOKEN: '${{ secrets.NPM_TOKEN }}'
