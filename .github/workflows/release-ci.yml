name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: [ci]
    uses: ./.github/workflows/release-github.yml
    permissions:
      contents: write
      pull-requests: write
