name: Release
on:
  push:
    branches: [main, next]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    name: CI
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    if: github.ref_type == 'branch'
    needs: [ci]
    uses: ./.github/workflows/release-github.yml
    with:
      target-branch: '${{ github.ref_name }}'
      prerelease-branch: 'next'

  release-tag:
    name: Release Tag
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/release-github.yml
    with:
      tag: '${{ github.ref_name }}'
