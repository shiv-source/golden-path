name: 'Apply Repository Configuration'
on:
  push:
    branches: [main]
    paths:
      - 'repositories/**'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to apply config to (owner/name)'
        type: string
        required: true

jobs:
  detect:
    name: Detect Changed Repos
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      repos: '${{ steps.detect.outputs.repos }}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed configs
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const { getChangedRepos } = await import(
              '${{ github.workspace }}/scripts/get-changed-repos.mjs'
            );
            const before = context.payload.before || 'HEAD~1';
            const after = context.payload.after || 'HEAD';
            core.setOutput('repos', JSON.stringify(getChangedRepos(before, after)));

  apply:
    name: Apply Configuration
    needs: ${{ github.event_name == 'push' && ['detect'] || [] }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.repo)) || fromJSON(needs.detect.outputs.repos) }}

    steps:
      - uses: actions/checkout@v4

      - name: Read config and merge profiles
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const { readProfiles } = await import(
              '${{ github.workspace }}/scripts/read-profiles.mjs'
            );
            const { mergeProfiles } = await import(
              '${{ github.workspace }}/scripts/merge-profiles.mjs'
            );
            const fs = require('node:fs');
            const path = require('node:path');
            const { execSync } = require('node:child_process');

            const ws = process.env.GITHUB_WORKSPACE;
            const repoName = '${{ matrix.repo }}'.includes('/')
              ? '${{ matrix.repo }}'.split('/').pop()
              : '${{ matrix.repo }}';

            const configYaml = fs.readFileSync(
              path.join(ws, 'repositories', `${repoName}.yaml`), 'utf-8'
            );
            const profileNames = [];
            for (const line of configYaml.split('\n')) {
              const m = line.match(/^\s{2}-\s(\S+)/);
              if (m && !line.trimStart().startsWith('#')) profileNames.push(m[1]);
            }
            core.setOutput('profiles', JSON.stringify(profileNames));

            const profiles = readProfiles({ profilesDir: path.join(ws, 'profiles'), names: profileNames });
            const merged = mergeProfiles(profiles);

            const targetRepo = '${{ matrix.repo }}'.includes('/')
              ? '${{ matrix.repo }}'
              : '${{ github.repository_owner }}/${{ matrix.repo }}';
            const targetDir = path.join(ws, 'target-repo');
            execSync(`gh repo clone ${targetRepo} ${targetDir}`, { stdio: 'inherit' });

            for (const f of merged.files) {
              const dest = path.join(targetDir, f.path);
              fs.mkdirSync(path.dirname(dest), { recursive: true });
              fs.writeFileSync(dest, f.content);
            }

            core.setOutput('filesCopied', String(merged.files.length));
            core.setOutput('conflictsFound', String(merged.conflicts.length > 0));
            core.setOutput(
              'conflictsList',
              merged.conflicts.map((c) => `- \`${c.path}\`: ${c.message}`).join('\n'),
            );

      - name: Create PR in target repo
        id: pr
        env:
          GH_TOKEN: '${{ secrets.BOT_TOKEN || github.token }}'
        uses: actions/github-script@v7
        with:
          script: |
            const { configureGit, commitAndPush } = await import(
              '${{ github.workspace }}/scripts/git-commit-push.mjs'
            );
            const { openOrReusePR } = await import(
              '${{ github.workspace }}/scripts/open-or-reuse-pr.mjs'
            );
            const path = require('node:path');

            const targetDir = path.join(process.env.GITHUB_WORKSPACE, 'target-repo');
            const branch = 'feature/apply-org-config';
            const repo = '${{ matrix.repo }}'.includes('/')
              ? '${{ matrix.repo }}'
              : '${{ github.repository_owner }}/${{ matrix.repo }}';

            configureGit(targetDir);
            const { skipped } = commitAndPush({
              branch,
              cwd: targetDir,
              message: 'chore: apply organization standard configuration',
            });
            if (skipped) {
              core.info('No changes — skipping PR.');
              return;
            }

            const conflicts = '${{ steps.merge.outputs.conflictsFound }}' === 'true'
              ? '\n### ⚠️ Conflicts Detected\n\n${{ steps.merge.outputs.conflictsList }}\n'
              : '';

            const result = await openOrReusePR({
              repo,
              baseBranch: 'main',
              headBranch: branch,
              title: 'Apply organization standard configuration',
              body: [
                '## Apply Organization Standard Configuration',
                '',
                'This PR applies standardized configuration from [golden-path](https://github.com/${{ github.repository }}).',
                '',
                '**Repository:** `${{ matrix.repo }}`',
                '**Files copied:** ${{ steps.merge.outputs.filesCopied }}',
                conflicts,
                '> Automatically generated. Please review carefully.',
              ].filter(Boolean).join('\n'),
            });
            core.setOutput('prUrl', result.url);
