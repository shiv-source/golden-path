name: 'Apply Repository Configuration'
on:
  push:
    branches: [main]
    paths:
      - 'repositories/**'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to apply config to (owner/name)'
        type: string
        required: true

jobs:
  apply:
    name: Apply Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        repo: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.repo)) || fromJSON(steps.changed.outputs.repos) }}

    steps:
      - uses: actions/checkout@v4

      - name: Get changed config files
        id: changed
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            const changed = execSync(
              'git diff --name-only HEAD~1 HEAD -- repositories/'
            ).toString().trim().split('\n').filter(Boolean);
            const repos = changed.map(f =>
              require('node:path').basename(f, '.yaml')
            );
            core.setOutput('repos', JSON.stringify(repos));

      - name: Clone target repository
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh repo clone "${{ github.repository_owner }}/${{ matrix.repo }}" target-repo

      - name: Read repo config and resolve profiles
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const yaml = fs.readFileSync(
              path.join(process.env.GITHUB_WORKSPACE, 'repositories', '${{ matrix.repo }}.yaml'),
              'utf-8'
            );
            core.setOutput('config', yaml);
            core.info(`Config: ${yaml}`);

      - name: Copy profile files to target repo
        run: |
          # For each profile listed in the config, copy its template files
          # into the target repo.  The scripts/merge-profiles.mjs handles this
          # in a fuller implementation.
          for profile in common node-service; do
            if [ -d "profiles/$profile" ]; then
              echo "Applying profile: $profile"
              cp -r "profiles/$profile/." target-repo/
            fi
          done

      - name: Detect conflicts
        id: conflicts
        run: |
          cd target-repo
          conflicts=""
          for file in .editorconfig CODEOWNERS SECURITY.md dependabot.yml; do
            if [ -f "../profiles/common/$file" ] && [ -f "$file" ]; then
              if ! diff -q "../profiles/common/$file" "$file" > /dev/null 2>&1; then
                conflicts="$conflicts $file (CONFLICT — manual review needed)"
              fi
            fi
          done
          if [ -n "$conflicts" ]; then
            echo "conflicts_found=true" >> "$GITHUB_OUTPUT"
            echo -e "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR in target repository
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          cd target-repo
          branch="feature/apply-org-config"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: apply organization standard configuration" || echo "No changes to commit"

          if [ "$(git rev-list --count $branch)" -eq 0 ]; then
            echo "No changes — skipping PR."
            exit 0
          fi

          git push origin "$branch" --force

          body="## Apply Organization Standard Configuration

          This PR applies standardized configuration files from the [golden-path](https://github.com/${{ github.repository }}) profiles.

          **Repository:** \`${{ matrix.repo }}\`
          **Config:** \`${{ steps.resolve.outputs.config }}\`

          ${{ steps.conflicts.outputs.conflicts_found == 'true' && format('### Conflicts Detected\n\nThe following files have different content in the target repository and require manual review:\n\n{0}', steps.conflicts.outputs.conflicts) || '' }}

          > This PR was automatically generated. Please review the changes carefully."

          pr_url=$(gh pr create \
            --title "Apply organization standard configuration" \
            --body "$body" \
            --base main \
            --head "$branch" 2>&1)

          echo "PR created: $pr_url"
