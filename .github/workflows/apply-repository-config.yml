name: 'Apply Repository Configuration'
on:
  push:
    branches: [main]
    paths:
      - 'repositories/**'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to apply config to (full name, e.g. org/repo)'
        type: string
        required: true

jobs:
  apply:
    name: Apply Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        repo: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.repo)) || fromJSON(steps.changed.outputs.repos) }}

    steps:
      - uses: actions/checkout@v4

      - name: Get changed config files
        id: changed
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            const changed = execSync(
              'git diff --name-only HEAD~1 HEAD -- repositories/'
            ).toString().trim().split('\n').filter(Boolean);
            const repos = changed.map(f =>
              require('node:path').basename(f, '.yaml')
            );
            core.setOutput('repos', JSON.stringify(repos));

      - name: Read repo config and resolve profiles
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const configPath = path.join(
              process.env.GITHUB_WORKSPACE, 'repositories', '${{ matrix.repo }}.yaml'
            );
            const config = fs.readFileSync(configPath, 'utf-8');
            core.setOutput('config', config);
            core.info(`Config: ${config}`);

      - name: Merge profiles and copy files
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const { mergeProfiles } = await import(
              '${{ github.workspace }}/scripts/merge-profiles.mjs'
            );
            const { resolveProfilesFor } = await import(
              '${{ github.workspace }}/scripts/lib/profile-map.mjs'
            );
            const fs = require('node:fs');
            const path = require('node:path');
            const { execSync } = require('node:child_process');

            const repoName = '${{ matrix.repo }}'.split('/').pop();
            const workspace = process.env.GITHUB_WORKSPACE;
            const profilesDir = path.join(workspace, 'profiles');
            const targetDir = path.join(workspace, 'target-repo');

            // Clone target repo
            const repoFull = '${{ github.repository_owner }}/${{ matrix.repo }}'.includes('/')
              ? '${{ matrix.repo }}'
              : '${{ github.repository_owner }}/${{ matrix.repo }}';
            execSync(`gh repo clone ${repoFull} ${targetDir}`, { stdio: 'inherit' });

            // Determine profiles from the config filename pattern
            // Parse the config to extract language/type, then resolve profiles
            const configYaml = fs.readFileSync(
              path.join(workspace, 'repositories', `${{ matrix.repo }}.yaml`), 'utf-8'
            );

            // Extract profile names listed in the config
            const profileNames = [];
            for (const line of configYaml.split('\n')) {
              const match = line.match(/^\s+-\s+(\S+)/);
              if (match) profileNames.push(match[1]);
            }

            // Build profile objects from filesystem
            const profiles = [];
            for (const name of profileNames) {
              const profilePath = path.join(profilesDir, name);
              if (!fs.existsSync(profilePath)) {
                core.warning(`Profile directory not found: ${profilePath}`);
                continue;
              }
              const files = [];
              const walkDir = (dir, base) => {
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const fullPath = path.join(dir, entry.name);
                  const relPath = path.relative(base, fullPath);
                  if (entry.isDirectory()) {
                    walkDir(fullPath, base);
                  } else {
                    files.push({
                      path: relPath,
                      content: fs.readFileSync(fullPath, 'utf-8'),
                    });
                  }
                }
              };
              walkDir(profilePath, profilePath);
              profiles.push({ name, files });
            }

            // Merge profiles with conflict detection
            const { files, conflicts } = mergeProfiles(profiles);

            // Write merged files to target repo
            for (const file of files) {
              const destPath = path.join(targetDir, file.path);
              fs.mkdirSync(path.dirname(destPath), { recursive: true });
              fs.writeFileSync(destPath, file.content);
            }

            core.setOutput('filesCopied', String(files.length));
            core.setOutput('conflictsFound', String(conflicts.length > 0));
            core.setOutput(
              'conflictsList',
              conflicts.map(c => `- \`${c.path}\`: ${c.message}`).join('\n')
            );

      - name: Create PR in target repository
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { openOrReusePR } = await import(
              '${{ github.workspace }}/scripts/open-or-reuse-pr.mjs'
            );
            const { execSync } = require('node:child_process');
            const path = require('node:path');

            const targetDir = path.join(process.env.GITHUB_WORKSPACE, 'target-repo');
            const branch = 'feature/apply-org-config';
            const repo = '${{ github.repository_owner }}/${{ matrix.repo }}'.includes('/')
              ? '${{ matrix.repo }}'
              : '${{ github.repository_owner }}/${{ matrix.repo }}';

            // Configure git and create branch
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
            execSync(`git checkout -b ${branch}`, { cwd: targetDir });
            execSync('git add -A', { cwd: targetDir });
            try {
              execSync('git commit -m "chore: apply organization standard configuration"', { cwd: targetDir });
            } catch {
              core.info('No changes to commit — skipping PR.');
              return;
            }
            execSync(`git push origin ${branch} --force`, { cwd: targetDir });

            const conflictsSection = '${{ steps.merge.outputs.conflictsFound }}' === 'true'
              ? '\n### ⚠️ Conflicts Detected\n\nThe following files have different content and require manual review:\n\n${{ steps.merge.outputs.conflictsList }}\n'
              : '';

            const body = [
              '## Apply Organization Standard Configuration',
              '',
              'This PR applies standardized configuration files from [golden-path](https://github.com/${{ github.repository }}).',
              '',
              '**Repository:** `${{ matrix.repo }}`',
              '**Files copied:** ${{ steps.merge.outputs.filesCopied }}',
              conflictsSection,
              '> This PR was automatically generated. Please review the changes carefully.',
            ].filter(Boolean).join('\n');

            const result = await openOrReusePR({
              repo,
              baseBranch: 'main',
              headBranch: branch,
              title: 'Apply organization standard configuration',
              body,
            });

            core.setOutput('prUrl', result.url);
            core.setOutput('reused', String(result.reused));
