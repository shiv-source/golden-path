name: 'Build & Test (Node.js)'

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        type: string
        default: '22'
      working-directory:
        description: 'Working directory for the Node.js project'
        type: string
        default: '.'
      shard-count:
        description: 'Number of test shards for parallel execution'
        type: number
        default: 3
      build-command:
        description: 'Build command override'
        type: string
        default: 'pnpm build'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ inputs.node-version }}'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: '${{ inputs.working-directory }}'
      - name: Lint
        run: pnpm lint
        working-directory: '${{ inputs.working-directory }}'

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ inputs.node-version }}'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: '${{ inputs.working-directory }}'
      - name: Type check
        run: pnpm typecheck
        working-directory: '${{ inputs.working-directory }}'

  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(format('[1,{0}]', inputs.shard-count)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ inputs.node-version }}'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: '${{ inputs.working-directory }}'
      - name: Test
        run: pnpm test -- --shard=${{ matrix.shard }}/${{ inputs.shard-count }}
        working-directory: '${{ inputs.working-directory }}'

  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ inputs.node-version }}'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: '${{ inputs.working-directory }}'
      - name: Build
        run: '${{ inputs.build-command }}'
        working-directory: '${{ inputs.working-directory }}'
