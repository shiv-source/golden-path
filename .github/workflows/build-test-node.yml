name: 'Build & Test (Node.js)'

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        type: string
        default: '22'
      working-directory:
        description: 'Working directory for the Node.js project'
        type: string
        default: '.'
      shard-count:
        description: 'Number of test shards for parallel execution'
        type: number
        default: 3
      build-command:
        description: 'Build command override'
        type: string
        default: 'npm run build'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ inputs.node-version }}'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        working-directory: '${{ inputs.working-directory }}'
      - name: Lint
        run: npm run lint
        working-directory: '${{ inputs.working-directory }}'

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ inputs.node-version }}'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        working-directory: '${{ inputs.working-directory }}'
      - name: Type check
        run: npm run typecheck
        working-directory: '${{ inputs.working-directory }}'

  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(format('[1,{0}]', inputs.shard-count)) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ inputs.node-version }}'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        working-directory: '${{ inputs.working-directory }}'
      - name: Test
        run: npm test -- --shard=${{ matrix.shard }}/${{ inputs.shard-count }}
        working-directory: '${{ inputs.working-directory }}'

  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ inputs.node-version }}'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        working-directory: '${{ inputs.working-directory }}'
      - name: Build
        run: '${{ inputs.build-command }}'
        working-directory: '${{ inputs.working-directory }}'
