name: 'Build & Test (Node.js)'

on:
    workflow_call:
        inputs:
            node-version:
                description: 'Node.js version'
                type: string
                default: '22'
            package-manager:
                description: 'Package manager: auto (detect), npm, pnpm, or yarn'
                type: string
                default: 'auto'
            working-directory:
                description: 'Working directory for the Node.js project'
                type: string
                default: '.'
            shard-count:
                description: 'Number of test shards for parallel execution'
                type: number
                default: 3
            lint-command:
                description: 'Lint command'
                type: string
                default: 'npm run lint'
            typecheck-command:
                description: 'Type check command'
                type: string
                default: 'npm run typecheck'
            test-command:
                description: 'Test command'
                type: string
                default: 'npm test'
            build-command:
                description: 'Build command'
                type: string
                default: 'npm run build'

permissions:
    contents: read

jobs:
    setup:
        name: Setup Shards
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            shards: '${{ steps.shards.outputs.shards }}'
        steps:
            - name: Generate shard list
              id: shards
              run: |
                  SHARDS=$(seq -s, 1 ${{ inputs.shard-count }})
                  echo "shards=[$SHARDS]" >> "$GITHUB_OUTPUT"

    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: shiv-source/golden-path/.github/actions/setup-node@main
              with:
                  node-version: ${{ inputs.node-version }}
                  package-manager: ${{ inputs.package-manager }}
                  working-directory: ${{ inputs.working-directory }}
            - name: Lint
              run: ${{ inputs.lint-command }}
              working-directory: ${{ inputs.working-directory }}

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: shiv-source/golden-path/.github/actions/setup-node@main
              with:
                  node-version: ${{ inputs.node-version }}
                  package-manager: ${{ inputs.package-manager }}
                  working-directory: ${{ inputs.working-directory }}
            - name: Type check
              run: ${{ inputs.typecheck-command }}
              working-directory: ${{ inputs.working-directory }}

    test:
        name: Test (shard ${{ matrix.shard }})
        needs: [setup]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                shard: ${{ fromJSON(needs.setup.outputs.shards) }}
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: shiv-source/golden-path/.github/actions/setup-node@main
              with:
                  node-version: ${{ inputs.node-version }}
                  package-manager: ${{ inputs.package-manager }}
                  working-directory: ${{ inputs.working-directory }}
            - name: Test
              run: ${{ inputs.test-command }} -- --test-shard=${{ matrix.shard }}/${{ inputs.shard-count }}
              working-directory: ${{ inputs.working-directory }}

    build:
        name: Build
        needs: [lint, typecheck, test]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: shiv-source/golden-path/.github/actions/setup-node@main
              with:
                  node-version: ${{ inputs.node-version }}
                  package-manager: ${{ inputs.package-manager }}
                  working-directory: ${{ inputs.working-directory }}
            - name: Build
              run: ${{ inputs.build-command }}
              working-directory: ${{ inputs.working-directory }}
