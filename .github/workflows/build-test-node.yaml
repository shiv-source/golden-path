name: 'Build & Test (Node.js)'

on:
    workflow_call:
        inputs:
            node-version:
                description: 'Node.js version'
                type: string
                default: '22'
            package-manager:
                description: 'Package manager: auto (detect), npm, pnpm, or yarn'
                type: string
                default: 'auto'
            working-directory:
                description: 'Working directory for the Node.js project'
                type: string
                default: '.'
            shard-count:
                description: 'Number of test shards for parallel execution'
                type: number
                default: 3
            lint-command:
                description: 'Lint command'
                type: string
                default: 'npm run lint'
            typecheck-command:
                description: 'Type check command'
                type: string
                default: 'npm run typecheck'
            test-command:
                description: 'Test command'
                type: string
                default: 'npm test'
            build-command:
                description: 'Build command'
                type: string
                default: 'npm run build'
            change-detection:
                description: 'Skip Node.js gates when no matching files changed on a pull request'
                type: boolean
                default: false
            change-paths:
                description: 'JSON array of glob patterns used for change detection'
                type: string
                default: '["**/*.{js,jsx,ts,tsx,mjs,cjs,json}", "package.json", "pnpm-lock.yaml", "yarn.lock", "package-lock.json", ".github/"]'
            coverage-command:
                description: >-
                    Command that runs tests with coverage and writes an istanbul
                    json-summary (e.g. 'npm run test:coverage'). Empty disables
                    the coverage job.
                type: string
                default: ''
            coverage-floor:
                description: 'Minimum required total coverage percentage (0 disables the gate)'
                type: number
                default: 0
            coverage-summary-path:
                description: 'Path to the istanbul json-summary file, relative to working-directory'
                type: string
                default: 'coverage/coverage-summary.json'

        outputs:
            coverage:
                description: 'Total test coverage percentage (empty when the coverage job is disabled)'
                value: ${{ jobs.coverage.outputs.coverage }}
            coverage_floor:
                description: 'Configured coverage floor percentage'
                value: ${{ jobs.coverage.outputs.coverage_floor }}

permissions:
    contents: read

jobs:
    changes:
        if: inputs.change-detection
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            node: ${{ steps.changed.outputs.changed }}
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
            - id: changed
              uses: shiv-source/golden-path/.github/actions/changed-files@main
              with:
                  paths: ${{ inputs.change-paths }}

    setup:
        name: Setup Shards
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            shards: '${{ steps.shards.outputs.shards }}'
        steps:
            - name: Generate shard list
              id: shards
              run: |
                  SHARDS=$(seq -s, 1 ${{ inputs.shard-count }})
                  echo "shards=[$SHARDS]" >> "$GITHUB_OUTPUT"

    lint:
        name: Lint
        needs: [changes]
        if: ${{ !inputs.change-detection || needs.changes.outputs.node == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: shiv-source/golden-path/.github/actions/setup-node@main
              with:
                  node-version: ${{ inputs.node-version }}
                  package-manager: ${{ inputs.package-manager }}
                  working-directory: ${{ inputs.working-directory }}
            - name: Lint
              run: ${{ inputs.lint-command }}
              working-directory: ${{ inputs.working-directory }}

    typecheck:
        name: Type Check
        needs: [changes]
        if: ${{ !inputs.change-detection || needs.changes.outputs.node == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: shiv-source/golden-path/.github/actions/setup-node@main
              with:
                  node-version: ${{ inputs.node-version }}
                  package-manager: ${{ inputs.package-manager }}
                  working-directory: ${{ inputs.working-directory }}
            - name: Type check
              run: ${{ inputs.typecheck-command }}
              working-directory: ${{ inputs.working-directory }}

    test:
        name: Test (shard ${{ matrix.shard }})
        needs: [changes, setup]
        if: ${{ !inputs.change-detection || needs.changes.outputs.node == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                shard: ${{ fromJSON(needs.setup.outputs.shards) }}
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: shiv-source/golden-path/.github/actions/setup-node@main
              with:
                  node-version: ${{ inputs.node-version }}
                  package-manager: ${{ inputs.package-manager }}
                  working-directory: ${{ inputs.working-directory }}
            - name: Test
              run: ${{ inputs.test-command }} -- --test-shard=${{ matrix.shard }}/${{ inputs.shard-count }}
              working-directory: ${{ inputs.working-directory }}

    coverage:
        name: Coverage Gate
        needs: [changes]
        if: ${{ (!inputs.change-detection || needs.changes.outputs.node == 'true') && inputs.coverage-command != '' && inputs.coverage-floor > 0 }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            coverage: ${{ steps.coverage.outputs.coverage }}
            coverage_floor: ${{ inputs.coverage-floor }}
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: shiv-source/golden-path/.github/actions/setup-node@main
              with:
                  node-version: ${{ inputs.node-version }}
                  package-manager: ${{ inputs.package-manager }}
                  working-directory: ${{ inputs.working-directory }}
            - name: Run coverage
              run: ${{ inputs.coverage-command }}
              working-directory: ${{ inputs.working-directory }}
            - name: Coverage gate (>= coverage-floor%)
              id: coverage
              shell: bash
              working-directory: ${{ inputs.working-directory }}
              run: |
                  pct=$(node -e "const s = require('./${{ inputs.coverage-summary-path }}').total; const v = s.lines || s.statements; process.stdout.write(String(v.pct));")
                  floor="${{ inputs.coverage-floor }}"
                  echo "coverage=$pct" >> "$GITHUB_OUTPUT"
                  echo "coverage=$pct% floor=$floor%"
                  awk -v t="$pct" -v f="$floor" 'BEGIN { exit !(t >= f) }'

    build:
        name: Build
        needs: [changes, lint, typecheck, test]
        if: ${{ !inputs.change-detection || needs.changes.outputs.node == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: shiv-source/golden-path/.github/actions/setup-node@main
              with:
                  node-version: ${{ inputs.node-version }}
                  package-manager: ${{ inputs.package-manager }}
                  working-directory: ${{ inputs.working-directory }}
            - name: Build
              run: ${{ inputs.build-command }}
              working-directory: ${{ inputs.working-directory }}
