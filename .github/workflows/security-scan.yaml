name: 'Security Scan'

on:
    workflow_call:
        inputs:
            language:
                description: >-
                    Programming language for CodeQL (node, go, python, java).
                    Empty (default) lets CodeQL auto-detect the repo's languages.
                type: string
                required: false
                default: ''
            gitleaks-config:
                description: 'Path to custom Gitleaks config (defaults to built-in rules)'
                type: string
                default: ''
            setup-command:
                description: >-
                    Command run after checkout and before CodeQL init (e.g. build
                    assets the Go code embeds, so CodeQL's Go autobuild succeeds).
                type: string
                default: ''
            build-mode:
                description: >-
                    CodeQL build mode: autobuild (default), manual, or none. Use
                    autobuild for compiled languages (go, java, C/C++); none is
                    only valid for interpreted languages (node, python).
                type: string
                default: 'autobuild'

permissions:
    contents: read

jobs:
    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
            - uses: shiv-source/golden-path/.github/actions/gitleaks@main
              with:
                  config: '${{ inputs.gitleaks-config }}'

    codeql:
        name: CodeQL
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            security-events: write
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Setup
              if: inputs.setup-command != ''
              shell: bash
              run: ${{ inputs.setup-command }}
            # github/codeql-action/init@codeql-bundle-v2.26.4
            # languages empty → CodeQL auto-detects; set the input to pin it.
            - uses: github/codeql-action/init@486fec2a3ea2626afcd8c7e9208b4f515078dd7e
              with:
                  languages: '${{ inputs.language }}'
                  build-mode: ${{ inputs.build-mode }}
            # github/codeql-action/analyze@codeql-bundle-v2.26.4
            - uses: github/codeql-action/analyze@486fec2a3ea2626afcd8c7e9208b4f515078dd7e
