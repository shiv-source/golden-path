name: 'Security Scan'

on:
    workflow_call:
        inputs:
            language:
                description: 'Programming language for CodeQL (node, go, python, java)'
                type: string
                required: true
            gitleaks-config:
                description: 'Path to custom Gitleaks config (defaults to built-in rules)'
                type: string
                default: ''

permissions:
    contents: read
    security-events: write

jobs:
    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
            - uses: shiv-source/golden-path/.github/actions/gitleaks@main
              with:
                  config: '${{ inputs.gitleaks-config }}'

    codeql:
        name: CodeQL
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            # github/codeql-action/init@codeql-bundle-v2.26.4
            - uses: github/codeql-action/init@486fec2a3ea2626afcd8c7e9208b4f515078dd7e
              with:
                  languages: '${{ inputs.language }}'
            # github/codeql-action/analyze@codeql-bundle-v2.26.4
            - uses: github/codeql-action/analyze@486fec2a3ea2626afcd8c7e9208b4f515078dd7e
