name: 'Betterleaks'

on:
  workflow_call:
    inputs:
      version:
        description: 'Betterleaks version'
        type: string
        default: '1.7.3'
      path:
        description: 'Path to scan (git repo or directory)'
        type: string
        default: '.'
      config:
        description: 'Path to betterleaks.toml config file'
        type: string
        default: ''
      args:
        description: 'Additional betterleaks arguments'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install betterleaks
        run: |
          curl -sSL "https://github.com/betterleaks/betterleaks/releases/download/v${{ inputs.version }}/betterleaks_${{ inputs.version }}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin betterleaks

      - name: Run betterleaks
        run: |
          betterleaks git "${{ inputs.path }}" \
            ${{ inputs.config && format('--config={0}', inputs.config) || '' }} \
            ${{ inputs.args }}
