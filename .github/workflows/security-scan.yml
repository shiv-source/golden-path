name: 'Security Scan'

on:
  workflow_call:
    inputs:
      language:
        description: 'Programming language for CodeQL (node, go, python, java)'
        type: string
        required: true
      gitleaks-config:
        description: 'Path to custom Gitleaks config (defaults to built-in rules)'
        type: string
        default: ''

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: '${{ inputs.gitleaks-config }}'

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: '${{ inputs.language }}'
      - uses: github/codeql-action/analyze@v3
