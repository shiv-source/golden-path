name: 'Secret Scan (GitGuardian)'

on:
    workflow_call:
        inputs:
            version:
                description: 'ggshield version (pip installable)'
                type: string
                default: '1.38.0'
            path:
                description: 'Path to scan (defaults to entire repo)'
                type: string
                default: '.'
            args:
                description: 'Additional ggshield arguments'
                type: string
                default: ''
        secrets:
            GITGUARDIAN_API_KEY:
                description: 'GitGuardian API key for secret detection'
                required: true

permissions:
    contents: read

jobs:
    scan:
        name: Secret Scan
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
            - uses: shiv-source/golden-path/.github/actions/ggshield@main
              with:
                  version: ${{ inputs.version }}
                  path: ${{ inputs.path }}
                  args: ${{ inputs.args }}
                  api-key: ${{ secrets.GITGUARDIAN_API_KEY }}
