name: 'Compliance Check'

on:
  workflow_call:
    inputs:
      required-files:
        description: 'Space-separated list of required file paths'
        type: string
        default: '.editorconfig CODEOWNERS SECURITY.md'
      require-branch-protection:
        description: 'Check branch protection rules'
        type: boolean
        default: true
      repo:
        description: 'Repository to check (defaults to current)'
        type: string
        default: '${{ github.repository }}'

jobs:
  check:
    name: Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run compliance checks
        id: compliance
        uses: actions/github-script@v7
        with:
          script: |
            const { complianceCheck } = await import(
              '${{ github.workspace }}/scripts/compliance-check.mjs'
            );

            const requiredFiles = '${{ inputs.required-files }}'.trim().split(/\s+/).filter(Boolean);

            const result = await complianceCheck({
              workspace: process.env.GITHUB_WORKSPACE,
              requiredFiles,
              checkBranchProtection: ${{ inputs.require-branch-protection }},
              repo: '${{ inputs.repo }}',
            });

            core.setOutput('passed', String(result.passed));
            core.setOutput('missingFiles', result.missingFiles.join(', '));
            core.setOutput('branchProtected', String(result.branchProtected));

            for (const error of result.errors) {
              core.error(error);
            }

            if (!result.passed) {
              core.setFailed(result.errors.join('; '));
            } else {
              core.info('All compliance checks passed.');
            }
