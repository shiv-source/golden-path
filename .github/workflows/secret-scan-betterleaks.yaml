name: 'Betterleaks'

on:
    workflow_call:
        inputs:
            version:
                description: 'Betterleaks version'
                type: string
                default: 'v1.8.1'
            path:
                description: 'Path to scan (git repo or directory)'
                type: string
                default: '.'
            config:
                description: 'Path to betterleaks.toml config file'
                type: string
                default: ''
            args:
                description: 'Additional betterleaks arguments'
                type: string
                default: ''

permissions:
    contents: read

jobs:
    scan:
        name: Secret Scan
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
            - uses: shiv-source/golden-path/.github/actions/betterleaks@main
              with:
                  version: ${{ inputs.version }}
                  path: ${{ inputs.path }}
                  config: ${{ inputs.config }}
                  args: ${{ inputs.args }}
