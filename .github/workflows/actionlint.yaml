name: 'Github Action Workflow Lint'

on:
    workflow_call:
        inputs:
            version:
                description: 'actionlint version'
                type: string
                default: 'v1.7.12'
            config:
                description: 'Path to an actionlint config file'
                type: string
                default: ''
            args:
                description: 'Extra actionlint arguments'
                type: string
                default: '-color'

permissions:
    contents: read

jobs:
    actionlint:
        name: Lint Workflows
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: shiv-source/golden-path/.github/actions/actionlint@main
              with:
                  version: ${{ inputs.version }}
                  config: ${{ inputs.config }}
                  args: ${{ inputs.args }}
