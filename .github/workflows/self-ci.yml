name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    gate:
        if: github.repository == 'shiv-source/golden-path'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - run: echo "Running on golden-path repo"

    lint:
        name: Lint + Typecheck
        needs: [gate]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with: { version: 11 }
            - uses: actions/setup-node@v7
              with: { node-version: 22, cache: 'pnpm' }
            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint
            - run: pnpm typecheck
    test:
        name: Test
        needs: [gate]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with: { version: 11 }
            - uses: actions/setup-node@v7
              with: { node-version: 22, cache: 'pnpm' }
            - run: pnpm install --frozen-lockfile
            - run: pnpm test
    dist:
        name: Actions bundle up to date
        needs: [gate]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with: { version: 11 }
            - uses: actions/setup-node@v7
              with: { node-version: 22, cache: 'pnpm' }
            - run: pnpm install --frozen-lockfile
            - run: pnpm build:actions
            - name: Assert committed bundles are current
              run: |
                  if ! git diff --quiet -- .github/actions/ || [ -n "$(git status --porcelain -- .github/actions/)" ]; then
                    echo "::error::Action bundles are stale. Run 'pnpm run build:actions' and commit the result."
                    git status --porcelain -- .github/actions/
                    exit 1
                  fi
    format:
        name: Format Check
        needs: [gate]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with: { version: 11 }
            - uses: actions/setup-node@v7
              with: { node-version: 22, cache: 'pnpm' }
            - run: pnpm install --frozen-lockfile
            - run: pnpm run format:check
    actionlint:
        name: Workflow Lint
        needs: [gate]
        uses: ./.github/workflows/actionlint.yml
    secret-scan:
        name: Secret Scan
        needs: [gate]
        uses: ./.github/workflows/secret-scan-betterleaks.yml
