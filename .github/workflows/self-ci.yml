name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    if: github.repository == 'shiv-source/golden-path'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Running on golden-path repo"

  lint:
    name: Lint Scripts
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - run: npm run lint
  test:
    name: Test Scripts
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - run: npm test
  format:
    name: Format Check
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - run: npm run format:check
  actionlint:
    name: Workflow Lint
    needs: [gate]
    uses: ./.github/workflows/actionlint.yml
  secret-scan:
    name: Secret Scan
    needs: [gate]
    uses: ./.github/workflows/secret-scan-betterleaks.yml
