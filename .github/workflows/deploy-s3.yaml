name: 'Deploy to S3'

on:
    workflow_call:
        inputs:
            aws-region:
                description: 'AWS region'
                type: string
                default: 'us-east-1'
            s3-bucket:
                description: 'S3 bucket name'
                type: string
                required: true
            s3-prefix:
                description: 'Prefix/path within the bucket (empty = root)'
                type: string
                default: ''
            source-dir:
                description: 'Local directory to upload'
                type: string
                default: 'dist'
            cache-control:
                description: 'Cache-Control header for uploaded files'
                type: string
                default: 'public, max-age=31536000, immutable'
            cloudfront-distribution:
                description: 'CloudFront distribution ID (skip invalidation if empty)'
                type: string
                default: ''
            invalidation-path:
                description: 'CloudFront invalidation path'
                type: string
                default: '/*'
            delete-removed:
                description: 'Delete files from S3 that do not exist locally'
                type: string
                default: 'true'
            aws-role-arn:
                description: 'IAM role ARN for OIDC authentication (preferred). Falls back to access keys if empty.'
                type: string
                default: ''
        secrets:
            AWS_ACCESS_KEY_ID:
                description: 'AWS access key ID (only if not using OIDC)'
                required: false
            AWS_SECRET_ACCESS_KEY:
                description: 'AWS secret access key (only if not using OIDC)'
                required: false

permissions:
    contents: read
    id-token: write

jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # actions/checkout@v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: shiv-source/golden-path/.github/actions/s3-deploy@main
              with:
                  aws-role-arn: ${{ inputs.aws-role-arn }}
                  aws-region: ${{ inputs.aws-region }}
                  s3-bucket: ${{ inputs.s3-bucket }}
                  s3-prefix: ${{ inputs.s3-prefix }}
                  source-dir: ${{ inputs.source-dir }}
                  cache-control: ${{ inputs.cache-control }}
                  cloudfront-distribution: ${{ inputs.cloudfront-distribution }}
                  invalidation-path: ${{ inputs.invalidation-path }}
                  delete-removed: ${{ inputs.delete-removed }}
