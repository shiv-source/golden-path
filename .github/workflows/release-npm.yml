name: 'Release (npm)'

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        type: string
        default: '22'
      registry:
        description: 'npm registry URL'
        type: string
        default: 'https://registry.npmjs.org'
      scope:
        description: 'npm scope (e.g., @myorg) — omit for unscoped packages'
        type: string
        default: ''
      version:
        description: 'Explicit version to publish (skips release-please)'
        type: string
        default: ''
      npm-tag:
        description: 'npm dist-tag (e.g., next, beta). Only used when version is set.'
        type: string
        default: ''
      dry-run:
        description: 'Run in dry-run mode (no actual publish)'
        type: boolean
        default: false
      working-directory:
        description: 'Working directory for the npm package'
        type: string
        default: '.'
    secrets:
      NPM_TOKEN:
        description: 'npm registry auth token'
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '${{ inputs.node-version }}'
          registry-url: '${{ inputs.registry }}'
          scope: '${{ inputs.scope }}'

      - name: Install dependencies
        run: npm ci
        working-directory: '${{ inputs.working-directory }}'

      - name: Determine next version
        id: release-please
        if: inputs.version == ''
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          dry-run: '${{ inputs.dry-run }}'

      - name: Publish explicit version
        if: inputs.version != '' && !inputs.dry-run
        run: |
          flags=""
          if [ -n "${{ inputs.npm-tag }}" ]; then
            flags="--tag ${{ inputs.npm-tag }}"
          fi
          npm version ${{ inputs.version }} --no-git-tag-version
          npm publish --provenance $flags
        working-directory: '${{ inputs.working-directory }}'
        env:
          NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'

      - name: Publish from release-please
        if: steps.release-please.outputs.release_created && !inputs.dry-run
        run: npm publish --provenance
        working-directory: '${{ inputs.working-directory }}'
        env:
          NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'
