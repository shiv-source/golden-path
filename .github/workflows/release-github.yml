name: 'Release (GitHub)'

on:
  workflow_call:
    inputs:
      tag-prefix:
        description: 'Tag prefix (e.g., "v")'
        type: string
        default: 'v'
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false
      generate-release-notes:
        description: 'Auto-generate release notes from commits'
        type: boolean
        default: true
      target-branch:
        description: 'Branch to release from'
        type: string
        default: 'main'
      extra-files:
        description: 'Newline-separated list of files to attach to release'
        type: string
        default: ''

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: '${{ steps.release-please.outputs.tag_name }}'
      version: '${{ steps.release-please.outputs.major }}.${{ steps.release-please.outputs.minor }}.${{ steps.release-please.outputs.patch }}'
      release_created: '${{ steps.release-please.outputs.release_created }}'
      release_type: '${{ steps.release-type.outputs.type }}'
      major: '${{ steps.release-please.outputs.major }}'
      minor: '${{ steps.release-please.outputs.minor }}'
      patch: '${{ steps.release-please.outputs.patch }}'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: release-please
        uses: googleapis/release-please-action@v4
        with:
          target-branch: '${{ inputs.target-branch }}'
          release-type: simple

      - name: Determine release type
        id: release-type
        if: steps.release-please.outputs.release_created
        run: |
          current="${{ steps.release-please.outputs.major }}.${{ steps.release-please.outputs.minor }}.${{ steps.release-please.outputs.patch }}"
          prefix="${{ inputs.tag-prefix }}"

          # Find the previous tag (second in sorted semver list)
          prev=$(git tag --list "${prefix}*" --sort=-version:refname | sed -n 2p | sed "s/^${prefix}//")

          if [ -z "$prev" ]; then
            echo "type=initial" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r p_major p_minor p_patch <<< "$prev"
          c_major=${{ steps.release-please.outputs.major }}
          c_minor=${{ steps.release-please.outputs.minor }}

          if [ "$c_major" -gt "$p_major" ]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif [ "$c_minor" -gt "$p_minor" ]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release-please.outputs.release_created
        env:
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ steps.release-please.outputs.tag_name }}'
        run: |
          flags=""
          ${{ inputs.draft }} && flags="$flags --draft"
          ${{ inputs.prerelease }} && flags="$flags --prerelease"
          ${{ inputs.generate-release-notes }} && flags="$flags --generate-notes"

          gh release create "$TAG" \
            --title "$TAG" \
            $flags

          if [ -n "${{ inputs.extra-files }}" ]; then
            echo "${{ inputs.extra-files }}" | while IFS= read -r file; do
              [ -f "$file" ] && gh release upload "$TAG" "$file"
            done
          fi
