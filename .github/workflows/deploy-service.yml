name: 'Deploy (Service)'

on:
  workflow_call:
    inputs:
      registry:
        description: 'Container registry (e.g., ghcr.io/org)'
        type: string
        default: ''
      image-name:
        description: 'Container image name'
        type: string
        required: true
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        default: 'Dockerfile'
      context:
        description: 'Docker build context'
        type: string
        default: '.'
      deploy-command:
        description: 'Deploy command override'
        type: string
        default: ''
    secrets:
      REGISTRY_TOKEN:
        description: 'Container registry auth token'
        required: true

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set registry
        id: registry
        run: |
          echo "value=${{ inputs.registry || 'ghcr.io' }}" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: '${{ steps.registry.outputs.value }}'
          username: '${{ github.actor }}'
          password: '${{ secrets.REGISTRY_TOKEN }}'

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: '${{ steps.registry.outputs.value }}/${{ github.repository_owner }}/${{ inputs.image-name }}'
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: '${{ inputs.context }}'
          file: '${{ inputs.dockerfile }}'
          push: true
          tags: '${{ steps.meta.outputs.tags }}'
          labels: '${{ steps.meta.outputs.labels }}'

  deploy:
    name: Deploy
    if: ${{ inputs.deploy-command != '' }}
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: '${{ inputs.deploy-command }}'
