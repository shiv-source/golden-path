name: 'Deploy (Service)'

on:
    workflow_call:
        inputs:
            registry:
                description: 'Container registry hostname (e.g., ghcr.io)'
                type: string
                default: ''
            image-name:
                description: 'Container image name'
                type: string
                required: true
            dockerfile:
                description: 'Path to Dockerfile'
                type: string
                default: 'Dockerfile'
            context:
                description: 'Docker build context'
                type: string
                default: '.'
            deploy-command:
                description: 'Deploy command override'
                type: string
                default: ''
        secrets:
            REGISTRY_TOKEN:
                description: 'Container registry auth token'
                required: true
        outputs:
            image:
                description: 'Fully-qualified container image name (registry/owner/name)'
                value: '${{ jobs.build-and-push.outputs.image }}'
            digest:
                description: 'Immutable image digest (sha256:...) for deployment pinning'
                value: '${{ jobs.build-and-push.outputs.digest }}'
            tags:
                description: 'Image tags applied (newline-separated)'
                value: '${{ jobs.build-and-push.outputs.tags }}'

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        name: Build & Push
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            image: '${{ steps.registry.outputs.value }}/${{ github.repository_owner }}/${{ inputs.image-name }}'
            digest: '${{ steps.build-and-push.outputs.digest }}'
            tags: '${{ steps.meta.outputs.tags }}'
        steps:
            - uses: actions/checkout@v4

            - name: Set registry
              id: registry
              run: |
                  echo "value=${{ inputs.registry || 'ghcr.io' }}" >> "$GITHUB_OUTPUT"

            - name: Login to registry
              uses: docker/login-action@v3
              with:
                  registry: '${{ steps.registry.outputs.value }}'
                  username: '${{ github.actor }}'
                  password: '${{ secrets.REGISTRY_TOKEN }}'

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: '${{ steps.registry.outputs.value }}/${{ github.repository_owner }}/${{ inputs.image-name }}'
                  tags: |
                      type=sha,prefix=,format=short
                      type=ref,event=branch
                      type=semver,pattern={{version}}

            - name: Build and push
              id: build-and-push
              uses: docker/build-push-action@v6
              with:
                  context: '${{ inputs.context }}'
                  file: '${{ inputs.dockerfile }}'
                  push: true
                  tags: '${{ steps.meta.outputs.tags }}'
                  labels: '${{ steps.meta.outputs.labels }}'

    deploy:
        name: Deploy
        if: ${{ inputs.deploy-command != '' }}
        needs: [build-and-push]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - name: Deploy
              env:
                  IMAGE: '${{ needs.build-and-push.outputs.image }}'
                  DIGEST: '${{ needs.build-and-push.outputs.digest }}'
                  TAGS: '${{ needs.build-and-push.outputs.tags }}'
              run: '${{ inputs.deploy-command }}'
