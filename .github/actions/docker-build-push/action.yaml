name: 'Docker Build & Push'
description: 'Build a Docker image, tag it, and push it to a container registry with digest + tag outputs.'

inputs:
    registry:
        description: 'Container registry hostname (defaults to ghcr.io)'
        required: false
        default: ''
    image-name:
        description: 'Container image name'
        required: true
    dockerfile:
        description: 'Path to Dockerfile'
        required: false
        default: 'Dockerfile'
    context:
        description: 'Docker build context'
        required: false
        default: '.'
    token:
        description: 'Container registry auth token (pass a secret)'
        required: true
    additional-tags:
        description: 'Newline-separated extra tags (e.g. type=semver,pattern={{version}})'
        required: false
        default: ''

outputs:
    image:
        description: 'Fully-qualified container image name (registry/owner/name)'
        value: ${{ steps.registry.outputs.value }}/${{ github.repository_owner }}/${{ inputs.image-name }}
    digest:
        description: 'Immutable image digest (sha256:...)'
        value: ${{ steps.build-and-push.outputs.digest }}
    tags:
        description: 'Image tags applied (newline-separated)'
        value: ${{ steps.meta.outputs.tags }}

runs:
    using: composite
    steps:
        - id: registry
          name: Set registry
          shell: bash
          run: |
              echo "value=${{ inputs.registry || 'ghcr.io' }}" >> "$GITHUB_OUTPUT"

        - name: Login to registry
          # docker/login-action@v4.6.0
          uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
          with:
              registry: ${{ steps.registry.outputs.value }}
              username: ${{ github.actor }}
              password: ${{ inputs.token }}

        - id: meta
          name: Docker metadata
          # docker/metadata-action@v6.2.0
          uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
          with:
              images: ${{ steps.registry.outputs.value }}/${{ github.repository_owner }}/${{ inputs.image-name }}
              tags: |
                  type=sha,prefix=,format=short
                  type=ref,event=branch
                  type=semver,pattern={{version}}
                  ${{ inputs.additional-tags }}

        - id: build-and-push
          name: Build and push
          # docker/build-push-action@v7.3.0
          uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
          with:
              context: ${{ inputs.context }}
              file: ${{ inputs.dockerfile }}
              push: true
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}
