name: 'Dependabot Auto-Merge'
description: 'Approve and auto-merge non-breaking Dependabot pull requests. Only acts on dependabot[bot] PRs.'

inputs:
    auto-merge:
        description: 'Auto-merge non-breaking dependency updates'
        required: false
        default: 'true'

outputs:
    update_type:
        description: 'Semver bump type from Dependabot (version-update:semver-patch|minor|major)'
        value: ${{ steps.metadata.outputs.update-type }}
    is_auto_merged:
        description: 'Whether the PR was approved and auto-merged'
        value: ${{ steps.merge-result.outputs.merged }}

runs:
    using: composite
    steps:
        - name: Dependabot metadata
          id: metadata
          # dependabot/fetch-metadata@v3.1.0
          uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98

        - name: Set merge default
          id: merge-result
          shell: bash
          run: echo "merged=false" >> "$GITHUB_OUTPUT"

        - name: Approve and auto-merge
          if: inputs.auto-merge == 'true' && (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor')
          env:
              GH_TOKEN: ${{ github.token }}
          shell: bash
          run: |
              gh pr review "${{ github.event.pull_request.html_url }}" --approve
              gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash
              echo "merged=true" >> "$GITHUB_OUTPUT"
