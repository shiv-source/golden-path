version: 2

go:
    - name: api
      working-directory: services/api
      go-version-file: services/api/go.mod
      change-detection:
          enabled: true
          paths:
              - 'services/api/**/*.go'
              - services/api/go.mod
              - services/api/go.sum
      coverage-floor: 90
      cross-compile:
          enabled: false
      lint:
          golangci-lint-version: v2.13.1
          config: .golangci.yaml
          timeout: 5m
          args: ''
    - name: worker
      working-directory: services/worker
      go-version-file: services/worker/go.mod
      coverage-floor: 60
      cross-compile:
          enabled: false

node:
    - name: web
      working-directory: packages/web
      package-manager: pnpm
      node-version: '22'
      shard-count: 3
      lint-command: pnpm lint
      typecheck-command: pnpm typecheck
      test-command: pnpm test
      build-command: pnpm build
    - name: cli
      working-directory: packages/cli
      node-version: '20'
      shard-count: 2

security-scan:
    enabled: true
    language: go

secret-scan:
    enabled: true
    tool: betterleaks

codespell:
    enabled: true

actionlint:
    enabled: true
