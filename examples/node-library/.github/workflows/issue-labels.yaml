name: issue-labels
# Auto-apply the three-tier issue labels (type, priority, areas) from the
# form answers the reporter selected. Add-only: the action never removes a
# label, so labels a human adds afterwards survive. Blank issues have no form
# sections to read and are left untouched.
#
# To use your own label set / form headings, add a config JSON to the repo and
# pass it via the `config` input (see .github/actions/issue-labels/config.json
# in golden-path for the reference shape):
#
#   with:
#     config: .github/issue-labels.json
on:
    issues:
        types: [opened, edited]

permissions:
    contents: read
    issues: write

jobs:
    apply:
        uses: shiv-source/golden-path/.github/workflows/issue-labels.yaml@v1
