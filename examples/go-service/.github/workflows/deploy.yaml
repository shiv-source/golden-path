name: Deploy
on:
    workflow_dispatch:
    push:
        tags: ['v*']

permissions:
    contents: read
    packages: write

jobs:
    deploy:
        uses: shiv-source/golden-path/.github/workflows/deploy-service.yaml@v1
        with:
            image-name: go-service
            dockerfile: Dockerfile
            context: .
            # Optional: run after the image is published.
            # deploy-command: kubectl set image deployment/go-service go-service=${{ needs.build-and-push.outputs.image }}
        secrets:
            REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
